apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
spec:
  project: default
  source:
    chart: vault
    repoURL: https://helm.releases.hashicorp.com
    targetRevision: 0.28.1
    helm:
      values: |
        server:
          dev:
            enabled: true         # Dev mode: runs in memory (perfect for learning)
            devRootToken: "root"  # The master password for dev mode
        injector:
          enabled: true           # Enable the Vault Agent sidecar injector
  destination:
    server: https://kubernetes.default.svc
    namespace: vault
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
