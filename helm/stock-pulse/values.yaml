replicaCount: 5

image:
  repository: jupiter000/stock-pulse
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "sha-baff2c5"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  # --- Vault Agent Sidecar Injector ---
  # Tells Vault to automatically inject a sidecar into this pod
  vault.hashicorp.com/agent-inject: "true"
  # Which Vault role to authenticate as (defined in vault-setup.sh)
  vault.hashicorp.com/role: "stock-pulse"
  # Which secret to fetch from Vault
  vault.hashicorp.com/agent-inject-secret-config: "secret/data/stock-pulse"
  # How to format the secret as a file inside the pod
  vault.hashicorp.com/agent-inject-template-config: |
    {{- with secret "secret/data/stock-pulse" -}}
    export DOCKERHUB_USERNAME="{{ .Data.data.DOCKERHUB_USERNAME }}"
    export DOCKERHUB_TOKEN="{{ .Data.data.DOCKERHUB_TOKEN }}"
    export NEXTAUTH_SECRET="{{ .Data.data.NEXTAUTH_SECRET }}"
    {{- end }}
  # The secret will appear inside the pod at: /vault/secrets/config


podSecurityContext: {}
  # fsGroup: 2000

securityContext:
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: true
  className: "nginx"
  annotations:
    # Rate limit: Max 2 requests per second per IP
    # nginx.ingress.kubernetes.io/limit-rps: "2"
    # nginx.ingress.kubernetes.io/limit-burst-multiplier: "1"
    
    nginx.ingress.kubernetes.io/limit-rpm: "20"

  hosts:
    - host: stock-pulse.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 10m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 50
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
